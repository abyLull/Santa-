<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dbe4f8">
<title>Тайный Санта</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#dbe4f8;        /* морозное небо */
    --blush:#f2ebf6;      /* лавандовый горизонт */
    --ink:#24304f;        /* глубокий синий */
    --ink-soft:#66708f;
    --berry:#3a6ee0;      /* синий E-license */
    --berry-deep:#2b55b8;
    --berry-tint:#e3ebfc;
    --stamp:#4a4fc6;      /* чернила печати */
    --pine:#4f8a78;       /* хвоя */
    --pine-tint:#e1f0ea;
    --gold:#f4cf86;       /* лента */
    --gold-tint:#fdf3dc;
    --glass:rgba(255,255,255,.74);
    --line:rgba(43,45,74,.09);
    --field:rgba(255,255,255,.85);
    --r-lg:28px; --r-md:18px; --r-sm:12px;
    --display:'Unbounded',system-ui,sans-serif;
    --body:'Manrope',-apple-system,'Segoe UI',Roboto,sans-serif;
    --ease:cubic-bezier(.2,.8,.2,1);
    --spring:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--blush)}
  body{margin:0;font-family:var(--body);color:var(--ink);font-size:16px;line-height:1.5;min-height:100vh;
    background:linear-gradient(180deg,var(--sky) 0%,#e5e6f7 40%,var(--blush) 100%) fixed;}
  #snow{position:fixed;inset:0;pointer-events:none;z-index:0}
  .wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 18px max(40px,env(safe-area-inset-bottom))}

  /* ---------- шапка ---------- */
  .hero{padding:10px 4px 22px}
  .hero a{color:inherit;text-decoration:none}
  .brand{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:500;font-size:13px;color:var(--ink-soft);letter-spacing:.2px}
  .brand svg{width:20px;height:20px}
  .mark{font-family:var(--display);font-weight:700;color:var(--ink);letter-spacing:-.2px}
  .mark b{color:var(--berry);font-weight:800}
  .team{display:inline-block;margin-left:2px;padding:2px 8px;border-radius:999px;background:var(--berry-tint);color:var(--berry-deep);font-size:11.5px;font-weight:700}
  .hero h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8.5vw,40px);line-height:1.05;letter-spacing:-.5px;margin:14px 0 8px;word-break:break-word}
  .hero p{margin:0;color:var(--ink-soft);font-size:15px;max-width:34ch}
  .facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .fact{background:rgba(255,255,255,.55);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}

  /* ---------- поверхности ---------- */
  .sheet{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);
    border-radius:var(--r-lg);padding:22px 20px;margin-bottom:16px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 18px 40px -18px rgba(52,72,140,.35)}
  .plain{padding:6px 4px 18px}
  h2{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.25;margin:0 0 6px;letter-spacing:-.2px}
  .lead{color:var(--ink-soft);font-size:14.5px;margin:0 0 16px;line-height:1.5}
  label{display:block;font-size:13.5px;font-weight:600;color:var(--ink-soft);margin:16px 0 7px}
  label:first-of-type{margin-top:4px}

  /* ---------- поля ---------- */
  input,textarea,select{width:100%;padding:14px 15px;border:1.5px solid transparent;border-radius:var(--r-md);font:inherit;font-size:16px;
    background:var(--field);color:var(--ink);transition:border-color .2s,box-shadow .2s,background .2s;box-shadow:0 1px 2px rgba(43,45,74,.06)}
  textarea{resize:vertical;min-height:92px;line-height:1.45}
  input::placeholder,textarea::placeholder{color:#a3a5bd}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--berry);background:#fff;box-shadow:0 0 0 5px rgba(58,110,224,.15)}
  .pin{font-family:var(--display);letter-spacing:18px;text-align:center;font-size:24px;font-weight:700;padding-left:30px}
  .row{display:flex;gap:10px}.row>*{flex:1;min-width:0}

  /* ---------- кнопки ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r-md);padding:15px 18px;
    font:inherit;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;transition:transform .15s var(--ease),box-shadow .2s,background .2s,opacity .2s;user-select:none}
  .btn:active{transform:scale(.97)}
  .btn:focus-visible,.link:focus-visible,.chipbtn:focus-visible{outline:3px solid rgba(58,110,224,.45);outline-offset:3px}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .btn-primary{color:#fff;background:linear-gradient(135deg,#4f84f0,var(--berry-deep));box-shadow:0 10px 22px -10px rgba(43,85,184,.75)}
  .btn-primary:hover{box-shadow:0 14px 26px -10px rgba(43,85,184,.85)}
  .btn-pine{color:#fff;background:linear-gradient(135deg,#5c9a87,#3f7766);box-shadow:0 10px 22px -12px rgba(63,119,102,.8)}
  .btn-soft{background:rgba(255,255,255,.9);color:var(--ink);box-shadow:0 1px 2px rgba(43,45,74,.08)}
  .btn-danger{background:transparent;color:#b6455f;border:1.5px solid rgba(182,69,95,.35)}
  .btn-sm{padding:10px 12px;font-size:14px;border-radius:14px}
  .block{width:100%;margin-top:16px}
  .link{background:none;border:0;padding:6px 2px;font:inherit;font-size:14px;font-weight:600;color:var(--ink-soft);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(108,111,142,.4)}
  .links{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 18px;margin-top:14px}
  .share{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
  .tg{background:#e3f2fb;color:#1f84bf}.wa{background:#e2f6ea;color:#1c8a4a}
  .err{color:#b6455f;font-size:14px;font-weight:600;margin-top:10px;min-height:1.2em}

  /* ---------- участники ---------- */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:rgba(255,255,255,.7);border-radius:999px;padding:8px 14px;font-size:14.5px;font-weight:600;animation:pop .45s var(--spring) both}
  .chip.me{background:var(--berry-tint);color:var(--berry-deep)}
  .count{font-family:var(--display);font-weight:700;font-size:13px;background:var(--ink);color:#fff;border-radius:999px;padding:2px 9px;margin-left:6px;vertical-align:2px}
  .people{margin-top:6px}
  .person{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
  .person:first-child{border-top:0}
  .avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;flex:0 0 auto}
  .person .n{flex:1;font-weight:700;word-break:break-word}
  .pill{font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 9px;background:rgba(43,45,74,.06);color:var(--ink-soft);white-space:nowrap}
  .pill.ok{background:var(--pine-tint);color:var(--pine)}
  .x{border:0;background:rgba(43,45,74,.06);border-radius:50%;width:32px;height:32px;cursor:pointer;color:var(--ink-soft);font-size:15px;flex:0 0 auto}
  .status{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:700;background:var(--gold-tint);color:#8a6418}
  .status.done{background:var(--pine-tint);color:var(--pine)}
  .status i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
  .linkbox{background:rgba(255,255,255,.75);border-radius:var(--r-sm);padding:12px 14px;font-size:14px;word-break:break-all;user-select:all;font-weight:600;margin-top:4px}
  .progress{height:8px;border-radius:99px;background:rgba(43,45,74,.08);overflow:hidden;margin:10px 0 2px}
  .progress b{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--pine),#83b8a6);transition:width .6s var(--ease)}

  /* ---------- подарок ---------- */
  .stage{position:relative;text-align:center;padding:6px 0 4px}
  .tap{font-weight:700;color:var(--ink-soft);margin:6px 0 2px;animation:breathe 2.4s ease-in-out infinite}
  .reveal{animation:rise .8s var(--spring) both}
  .to{font-size:15px;color:var(--ink-soft);font-weight:600;margin:0}
  .name{font-family:var(--display);font-weight:800;font-size:clamp(34px,11vw,48px);line-height:1.05;letter-spacing:-.8px;margin:8px 0 18px;word-break:break-word;
    background:linear-gradient(135deg,#3a6ee0,#7a55c9);-webkit-background-clip:text;background-clip:text;color:transparent}
  .wish{position:relative;text-align:left;background:var(--gold-tint);border-radius:var(--r-md);padding:16px 16px 16px 18px;font-size:15.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .wish::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--gold)}
  .wish .who{display:block;font-weight:800;font-size:13.5px;color:#8a6418;margin-bottom:4px}
  .wish.empty{background:rgba(255,255,255,.6);color:var(--ink-soft)}
  .wish.empty::before{background:rgba(43,45,74,.12)}
  .secret{font-size:14px;color:var(--ink-soft);margin:14px 0 0;font-weight:600}
  .doc{position:relative;text-align:left;background:#fffdf8;border-radius:20px;padding:20px 18px 22px;margin:2px -4px 0;overflow:hidden;
    box-shadow:0 1px 0 #fff inset,0 14px 34px -16px rgba(36,48,79,.45);animation:unfold .7s var(--spring) both;transform-origin:50% 0}
  .doc::before{content:'';position:absolute;inset:8px;border-radius:14px;pointer-events:none;
    border:1.5px solid rgba(58,110,224,.22);box-shadow:0 0 0 4px #fffdf8,0 0 0 5px rgba(58,110,224,.12)}
  .doc-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-soft);font-weight:600;position:relative}
  .doc-head .mark{font-size:14px}
  .doc h3{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.25;margin:14px 0 2px;position:relative}
  .doc .no{font-size:13px;color:var(--ink-soft);font-weight:600;font-variant-numeric:tabular-nums;position:relative}
  .field{position:relative;margin-top:14px}
  .field>small{display:block;font-size:12.5px;color:var(--ink-soft);font-weight:600}
  .val{font-weight:700;font-size:16px;white-space:nowrap}
  .doc .name{margin:0;text-align:left;font-size:clamp(30px,9vw,40px)}
  .doc .wish{margin-top:6px;font-size:15.5px}
  .terms{display:flex;gap:28px;position:relative;margin-top:14px}
  .terms>div>small{display:block;font-size:12.5px;color:var(--ink-soft);font-weight:600}
  .sign{position:relative;height:104px;margin-top:12px;border-top:1px dashed rgba(36,48,79,.18);padding-top:10px}
  .sign small{display:block;font-size:12.5px;color:var(--ink-soft);font-weight:600}
  .sign i{font-family:'Brush Script MT','Segoe Script',cursive;font-size:24px;color:var(--stamp);opacity:.85;display:inline-block;transform:rotate(-4deg);margin-top:4px}
  .stamp{position:absolute;right:14px;bottom:14px;width:118px;height:118px;color:var(--stamp);opacity:0;pointer-events:none;mix-blend-mode:multiply}
  .stamp.in{animation:stamp .55s .75s cubic-bezier(.2,1.4,.4,1) forwards}
  .stamp.static{opacity:.85;transform:rotate(-14deg)}
  .doc.thud{animation:unfold .7s var(--spring) both,thud .35s 1.05s ease-out}
  .status-card{text-align:center;padding:8px 0 4px}
  .status-card .big{font-family:var(--display);font-weight:800;font-size:24px;margin:10px 0 4px}
  .tick{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:4px auto 0;background:var(--pine-tint);color:var(--pine);animation:pop .6s var(--spring) both}
  .tick svg{width:30px;height:30px}
  .confetti{position:absolute;left:70%;top:78%;z-index:3;width:9px;height:14px;border-radius:3px;pointer-events:none;opacity:0;
    animation:burst 1.3s var(--ease) forwards}

  /* ---------- ожидание ---------- */
  .waiting{display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.6);border-radius:var(--r-md);padding:14px;margin-bottom:6px}
  .waiting svg{flex:0 0 48px;height:48px;animation:bob 3s ease-in-out infinite}
  .waiting p{margin:0;font-size:14.5px;color:var(--ink-soft)}
  .waiting b{color:var(--ink)}

  /* ---------- служебное ---------- */
  .center{text-align:center}
  .loader{text-align:center;padding:70px 10px;color:var(--ink-soft);font-weight:600}
  .loader svg{width:64px;height:64px;animation:bob 1.6s ease-in-out infinite;display:block;margin:0 auto 14px}
  .enter>*{animation:rise .6s var(--ease) both}
  .enter>*:nth-child(2){animation-delay:.08s}
  .enter>*:nth-child(3){animation-delay:.16s}
  .enter>*:nth-child(4){animation-delay:.24s}
  .hidden{display:none!important}
  .overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px;
    background:rgba(43,45,74,.32);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .25s ease both}
  .modal{background:#fff;border-radius:var(--r-lg);padding:24px 20px 20px;max-width:420px;width:100%;animation:sheetup .4s var(--spring) both;margin-bottom:max(0px,env(safe-area-inset-bottom))}
  .modal h3{font-family:var(--display);font-size:20px;margin:0 0 8px}
  .modal p{color:var(--ink-soft);margin:0 0 18px;line-height:1.5}
  .modal .btns{display:flex;gap:10px}.modal .btns>*{flex:1}
  @media(min-width:600px){.overlay{align-items:center}}
  .toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,30px);z-index:30;background:var(--ink);color:#fff;
    padding:12px 18px;border-radius:16px;font-size:14.5px;font-weight:600;opacity:0;transition:opacity .25s,transform .35s var(--spring);pointer-events:none;max-width:90%;text-align:center;box-shadow:0 12px 30px -10px rgba(43,45,74,.5)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .foot{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:18px;line-height:1.5}

  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}}
  @keyframes sheetup{from{opacity:0;transform:translateY(40px) scale(.98)}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(-1.5deg)}}
  @keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg) scale(1.03)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
  @keyframes sink{to{transform:translateY(30px) scale(.85);opacity:0}}
  @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes unfold{from{opacity:0;transform:perspective(700px) rotateX(-70deg) translateY(-10px)}to{opacity:1;transform:none}}
  @keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-40deg)}70%{opacity:.9;transform:scale(.92) rotate(-12deg)}100%{opacity:.85;transform:scale(1) rotate(-14deg)}}
  @keyframes thud{0%,100%{transform:none}30%{transform:translateY(3px) scale(.995)}}
  @keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) rotate(0)}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot))}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    #snow{display:none}
  }
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="hero" id="hero"></header>
  <main id="app">
    <div class="loader"><svg viewBox="0 0 64 64"><rect x="10" y="26" width="44" height="30" rx="6" fill="#3a6ee0"/><rect x="6" y="18" width="52" height="12" rx="5" fill="#5b8bf0"/><rect x="28" y="18" width="8" height="38" fill="#f4cf86"/></svg>Загружаем…</div>
  </main>
  <div class="foot">Пары знает только сервер. Даже организатор их не видит.<br>Внутренняя игра команды, не государственная услуга 🙂</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';
  /* ================= утилиты ================= */
  const $ = (id) => document.getElementById(id);
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function el(tag, attrs, ...kids){
    const e = document.createElement(tag);
    for (const k in (attrs||{})){
      const v = attrs[k];
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (k === 'value') e.value = v;
      else e.setAttribute(k, v === true ? '' : v);
    }
    kids.flat().forEach(c => { if (c === null || c === undefined || c === '' || c === false) return; e.append(c instanceof Node ? c : document.createTextNode(c)); });
    return e;
  }
  const ls = {
    get(k){ try { return localStorage.getItem(k); } catch { return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch {} },
    del(k){ try { localStorage.removeItem(k); } catch {} },
  };
  let toastT;
  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }

  function confirmBox(title, text, okText, onOk){
    const ov = el('div',{class:'overlay',onclick:(e)=>{ if (e.target===ov) ov.remove(); }},
      el('div',{class:'modal',role:'dialog','aria-modal':'true'},
        el('h3',{},title), el('p',{},text),
        el('div',{class:'btns'},
          el('button',{class:'btn btn-soft',onclick:()=>ov.remove()},'Отмена'),
          el('button',{class:'btn btn-primary',onclick:()=>{ ov.remove(); onOk(); }},okText))));
    document.body.append(ov);
    ov.querySelector('.btn-primary').focus();
  }
  const modalOpen = () => !!document.querySelector('.overlay');

  let slowT;
  async function api(method, url, body, headers){
    clearTimeout(slowT);
    slowT = setTimeout(()=>toast('Сервер просыпается, это займёт до минуты'), 4000);
    try{
      const r = await fetch(url, { method, headers: { 'Content-Type':'application/json', ...(headers||{}) }, body: body ? JSON.stringify(body) : undefined });
      let data = {}; try { data = await r.json(); } catch {}
      if (!r.ok) { const e = new Error(data.error || 'Ошибка '+r.status); e.status = r.status; throw e; }
      return data;
    } finally { clearTimeout(slowT); }
  }
  async function copy(text, okMsg){
    try { await navigator.clipboard.writeText(text); toast(okMsg || 'Скопировано'); }
    catch { window.prompt('Скопируйте:', text); }
  }
  function busy(btn, on){ if (!btn) return; btn.disabled = on; if (on) { btn.dataset.t = btn.textContent; btn.textContent = 'Секунду…'; } else if (btn.dataset.t) btn.textContent = btn.dataset.t; }
  function shareButtons(text, url){
    return el('div',{class:'share'},
      el('a',{class:'btn btn-sm tg',href:'https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(text),target:'_blank',rel:'noopener'},'Telegram'),
      el('a',{class:'btn btn-sm wa',href:'https://wa.me/?text='+encodeURIComponent(text+'\n'+url),target:'_blank',rel:'noopener'},'WhatsApp'),
      el('button',{class:'btn btn-sm btn-soft',onclick:()=>copy(text+'\n'+url,'Ссылка скопирована')},'Копировать'));
  }
  // мягкие цвета аватарок по имени
  const AV = [['#fbe3ea','#bb4468'],['#e1f0ea','#3f7766'],['#e6e3fa','#5b4fb0'],['#fdf3dc','#8a6418'],['#e2eefa','#2d6a9a']];
  function avatar(name){ let h=0; for (const c of name) h=(h*31+c.charCodeAt(0))>>>0; const [bg,fg]=AV[h%AV.length];
    return el('span',{class:'avatar',style:{background:bg,color:fg}}, (name.trim()[0]||'?').toUpperCase()); }

  const giftIcon = () => '<svg viewBox="0 0 24 24"><rect x="3" y="10" width="18" height="11" rx="2.5" fill="#3a6ee0"/><rect x="2" y="7" width="20" height="5" rx="2" fill="#5b8bf0"/><rect x="10.5" y="7" width="3" height="14" fill="#f4cf86"/><path d="M12 7c-2-4-6-4-6-1.5S9.5 7 12 7zm0 0c2-4 6-4 6-1.5S14.5 7 12 7z" fill="#f4cf86"/></svg>';

  function hero({ title, sub, facts, homeLink=true }){
    const h = $('hero'); h.innerHTML='';
    [
      el('a',{class:'brand',href:'/',html: giftIcon()+'<span>Тайный Санта</span> <span class="team">команда <span class="mark">E-<b>license</b></span></span>'}),
      el('h1',{}, title),

      facts && facts.length ? el('div',{class:'facts'}, facts.map(f=>el('span',{class:'fact'},f))) : null

  const factsOf = (g) => [g.budget && '💰 '+g.budget, g.date && '📅 '+g.date].filter(Boolean);

  function render(...nodes){
    const a=$('app'); a.innerHTML=''; a.classList.remove('enter'); void a.offsetWidth;
    if (!render.quiet) a.classList.add('enter');
    nodes.flat().forEach(n=>n && a.append(n));
  }

  /* ================= снег ================= */
  (function snow(){
    if (reduceMotion) return;
    const c=$('snow'), ctx=c.getContext('2d'); let W,H,flakes=[];
    const resize=()=>{ const d=Math.min(devicePixelRatio||1,2); W=c.width=innerWidth*d; H=c.height=innerHeight*d; c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px';
      flakes=Array.from({length:Math.round(innerWidth/9)},()=>({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*2.4+1)*d,s:(Math.random()*.5+.25)*d,w:Math.random()*Math.PI*2})); };
    resize(); addEventListener('resize',resize);
    (function tick(){
      ctx.clearRect(0,0,W,H);
      for (const f of flakes){
        f.y+=f.s; f.w+=.012; f.x+=Math.sin(f.w)*.35;
        if (f.y>H+5){ f.y=-5; f.x=Math.random()*W; }
        ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
        ctx.fillStyle='rgba(255,255,255,'+(.55+f.r/10)+')'; ctx.fill();
      }
      requestAnimationFrame(tick);
    })();
  })();

  /* ================= маршрутизация ================= */
  const m = location.pathname.match(/^\/g\/([a-z0-9]+)(\/admin)?\/?$/);
  if (m && m[2]) adminPage(m[1]);
  else if (m) playerPage(m[1]);
  else homePage();

  function rememberGame(id, title, admin){
    const all = JSON.parse(ls.get('santa:games') || '[]');
    const prev = all.find(g => g.id === id);
    const list = all.filter(g => g.id !== id);
    list.unshift({ id, title, admin: admin || (prev && prev.admin) || false });
    ls.set('santa:games', JSON.stringify(list.slice(0,20)));
  }

  /* ================= главная ================= */
  function homePage(){
    hero({ title:'Новогодняя услуга для своих', sub:'Без ЭЦП и очередей: подаёте заявку, получаете разрешение на вручение подарка, а кто дарит вам — секрет до праздника.' });
    const mine = JSON.parse(ls.get('santa:games') || '[]');
    const t = el('input',{placeholder:'Новый год E-license',maxlength:'60',id:'f-title'});
    const b = el('input',{placeholder:'до 10 000 ₸',maxlength:'30',id:'f-budget'});
    const d = el('input',{placeholder:'27 декабря',maxlength:'30',id:'f-date'});
    const err = el('div',{class:'err'});
    const btn = el('button',{class:'btn btn-primary block',onclick:async()=>{
      err.textContent=''; busy(btn,true);
      try{
        const r = await api('POST','/api/games',{ title:t.value || 'Новый год E-license', budget:b.value, date:d.value });
        ls.set('santa:admin:'+r.id, r.adminKey);
        rememberGame(r.id, t.value || 'Новый год E-license', true);

    render(

        el('p',{class:'lead'},'Вы получите ссылку для рабочего чата. Каждый откроет её на телефоне и подаст заявку с пожеланием.'),
        el('label',{for:'f-title'},'Название'), t,
        el('div',{class:'row'}, el('div',{},el('label',{for:'f-budget'},'Бюджет'),b), el('div',{},el('label',{for:'f-date'},'Дата обмена'),d)),
        btn, err),
      mine.length ? el('section',{class:'plain'}, el('h2',{},'Мои игры'),
        el('div',{class:'people'}, mine.map(g => el('div',{class:'person'},
          avatar(g.title),
          el('a',{class:'n',href:'/g/'+g.id+(g.admin?'/admin':''),style:{color:'inherit',textDecoration:'none'}}, g.title),
          el('span',{class:'pill'+(g.admin?' ok':'')}, g.admin ? 'организатор' : 'участник'))))) : null
    );

  /* ================= страница участника ================= */
  function playerPage(id){
    const S = { id, game:null, me:null, recipient:null, token: ls.get('santa:token:'+id), mode:'join', dirty:false, shown:false };
    const shareUrl = location.origin + '/g/' + id;
    const H = () => ({'X-Player-Token':S.token});

    async function load(){
      try{ S.game = await api('GET','/api/games/'+id); }
      catch(e){
        hero({ title: e.status===404 ? 'Игра не найдена' : 'Не получилось загрузить' });
        return render(el('section',{class:'sheet center'},
          el('p',{class:'lead'}, e.status===404 ? 'Проверьте ссылку или создайте новую игру.' : e.message),
          e.status===404 ? el('a',{class:'btn btn-primary',href:'/'},'Создать игру') : el('button',{class:'btn btn-primary',onclick:load},'Повторить')));
      }
      if (S.token){
        try{ const r = await api('GET','/api/games/'+id+'/me',null,H()); S.me=r.me; S.recipient=r.recipient; S.game=r.game; }
        catch(e){ if (e.status===401){ ls.del('santa:token:'+id); S.token=null; S.me=null; } }
      }
      rememberGame(id, S.game.title, false);
      draw();
    }

    function draw(){
      const g = S.game;
      document.title = g.title + ' · Тайный Санта';
      hero({ title:g.title, facts:factsOf(g) });
      S.dirty = false;
      render(S.me ? playerView() : authView());
      S.shown = true;
    }

    /* ---------- вход ---------- */
    function authView(){
      const g = S.game;
      const err = el('div',{class:'err'});
      if (g.status === 'open' && S.mode === 'join'){
        const name = el('input',{id:'j-name',placeholder:'Например, Айгерим',maxlength:'40',autocomplete:'given-name'});
        const pin = el('input',{id:'j-pin',class:'pin',type:'password',inputmode:'numeric',maxlength:'4',placeholder:'••••',autocomplete:'off'});
        const wish = el('textarea',{id:'j-wish',placeholder:'Книга, настолка, что-то вкусное к чаю…',maxlength:'300'});
        const btn = el('button',{class:'btn btn-primary block',onclick:async()=>{
          err.textContent=''; busy(btn,true);
          try{
            const r = await api('POST','/api/games/'+id+'/join',{ name:name.value, pin:pin.value, wish:wish.value });
            S.token = r.token; ls.set('santa:token:'+id, r.token);
            toast('Заявка принята 🎉'); await load();
          }catch(e){ err.textContent=e.message; busy(btn,false); }
        }},'Подать заявку');
        return [
          el('section',{class:'sheet'},
            el('h2',{},'Подать заявку на участие'),
            el('p',{class:'lead'},'Вместо ЭЦП здесь PIN. Он понадобится, чтобы зайти с другого телефона, и без него вашу карточку никто не откроет.'),
            el('label',{for:'j-name'},'Ваше имя'), name,
            el('label',{for:'j-pin'},'PIN из 4 цифр'), pin,
            el('label',{for:'j-wish'},'Что бы вы хотели получить'), wish,
            btn, err,
            g.players.length ? el('div',{class:'links'}, el('button',{class:'link',onclick:()=>{S.mode='login';draw();}},'Я уже подавал(а) заявку')) : null),
          g.players.length ? el('section',{class:'plain'},
            el('h2',{},'Заявки подали', el('span',{class:'count'}, String(g.players.length))),
            el('div',{class:'chips',style:{marginTop:'12px'}}, g.players.map((p,i)=>el('span',{class:'chip',style:{animationDelay:(i*40)+'ms'}},p.name)))) : null
        ];
      }
      if (!g.players.length) return el('section',{class:'sheet center'}, el('p',{class:'lead'},'В игре пока никого нет.'));
      const sel = el('select',{id:'l-who'}, el('option',{value:''},'Выберите своё имя'), g.players.map(p=>el('option',{value:p.id},p.name)));
      const pin = el('input',{id:'l-pin',class:'pin',type:'password',inputmode:'numeric',maxlength:'4',placeholder:'••••',autocomplete:'off'});
      const btn = el('button',{class:'btn btn-primary block',onclick:async()=>{
        err.textContent='';
        if (!sel.value){ err.textContent='Выберите своё имя из списка'; return; }
        busy(btn,true);
        try{
          const r = await api('POST','/api/games/'+id+'/login',{ playerId:sel.value, pin:pin.value });
          S.token = r.token; ls.set('santa:token:'+id, r.token); await load();
        }catch(e){ err.textContent=e.message; pin.value=''; busy(btn,false); }
      }},'Войти');
      return el('section',{class:'sheet'},
        el('h2',{}, g.status==='drawn' ? 'Разрешения выданы' : 'С возвращением'),
        el('p',{class:'lead'}, g.status==='drawn' ? 'Выберите своё имя и введите PIN, чтобы получить своё разрешение на вручение подарка.' : 'Выберите своё имя и введите PIN, который придумали при подаче заявки.'),
        el('label',{for:'l-who'},'Кто вы'), sel,
        el('label',{for:'l-pin'},'PIN'), pin,
        btn, err,
        el('div',{class:'links'},
          g.status==='open' ? el('button',{class:'link',onclick:()=>{S.mode='join';draw();}},'Я здесь впервые') : null),
        el('p',{class:'lead center',style:{margin:'14px 0 0',fontSize:'13px'}},'Забыли PIN? Попросите организатора удалить вас до жеребьёвки и запишитесь заново.'));
    }

    /* ---------- карточка участника ---------- */
    function wishEditor(){
      const ta = el('textarea',{id:'w-me',maxlength:'300',placeholder:'Книга, настолка, что-то вкусное к чаю…',value:S.me.wish});
      const btn = el('button',{class:'btn btn-pine block',onclick:async()=>{
        busy(btn,true);
        try{
          const r = await api('PUT','/api/games/'+id+'/me/wish',{ wish:ta.value },H());
          S.me.wish = r.wish; toast('Пожелание сохранено'); render.quiet=true; draw(); render.quiet=false;
        }catch(e){ toast(e.message); busy(btn,false); }
      }},'Сохранить пожелание');
      return [ta, btn];

    function accountLinks(){
      const g = S.game;
      return el('div',{class:'links'},
        el('button',{class:'link',onclick:()=>confirmBox('Выйти на этом телефоне?','Вернуться можно по своему имени и PIN.','Выйти',()=>{ ls.del('santa:token:'+id); S.token=null; S.me=null; S.mode='login'; draw(); })},'Выйти на этом телефоне'),
        g.status==='open' ? el('button',{class:'link',onclick:()=>confirmBox('Покинуть игру?','Вас уберут из списка участников.','Покинуть',async()=>{
          try{ await api('DELETE','/api/games/'+id+'/me',null,H()); ls.del('santa:token:'+id); S.token=null; S.me=null; S.mode='join'; await load(); }
          catch(e){ toast(e.message); }
        })},'Покинуть игру') : null);
    }

    function docNumber(){
      let h=7; for (const c of id+S.me.id) h=(h*131+c.charCodeAt(0))%100000;
      return '№ ЕЛ-'+new Date().getFullYear()+'-'+String(h).padStart(5,'0');
    }
    const STAMP = `<svg viewBox="0 0 120 120" aria-hidden="true">
      <defs><path id="ring" d="M60,60 m-44,0 a44,44 0 1,1 88,0 a44,44 0 1,1 -88,0"/></defs>
      <circle cx="60" cy="60" r="56" fill="none" stroke="currentColor" stroke-width="3"/>
      <circle cx="60" cy="60" r="36" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text font-family="Manrope,sans-serif" font-size="10.5" font-weight="800" letter-spacing="2.2" fill="currentColor">
        <textPath href="#ring">ТАЙНЫЙ САНТА ✦ E-LICENSE ✦ ДЕД МОРОЗ ✦</textPath></text>
      <text x="60" y="58" text-anchor="middle" font-family="Unbounded,Manrope,sans-serif" font-size="15" font-weight="800" fill="currentColor">ВЫДАНО</text>
      <text x="60" y="74" text-anchor="middle" font-family="Manrope,sans-serif" font-size="9" font-weight="700" fill="currentColor">🎄 ${new Date().getFullYear()+1}</text>
    </svg>`;
    function licenseDoc(r, animate){
      const g = S.game;
      const doc = el('div',{class:'doc'+(animate?' thud':'')},
        el('div',{class:'doc-head'}, el('span',{class:'mark',html:'E-<b>license</b>'}), el('span',{},'Разрешительный документ')),
        el('h3',{},'Разрешение на вручение подарка'),
        el('div',{class:'no'}, docNumber()),
        el('div',{class:'field'}, el('small',{},'Выдано'), el('div',{class:'val'}, S.me.name)),
        el('div',{class:'field'}, el('small',{},'Получатель подарка'), el('div',{class:'name'}, r.name)),
        el('div',{class:'field'}, el('small',{},'Пожелание получателя'),
          r.wish ? el('div',{class:'wish'}, r.wish)
                 : el('div',{class:'wish empty'}, 'Пока не указано. Как только '+r.name+' напишет, оно появится здесь.')),
        (g.budget || g.date) ? el('div',{class:'terms'},
          g.budget ? el('div',{}, el('small',{},'Бюджет'), el('div',{class:'val'}, g.budget)) : null,
          g.date ? el('div',{}, el('small',{},'Срок исполнения'), el('div',{class:'val'}, g.date)) : null) : null,
        el('div',{class:'sign'}, el('small',{},'Подпись уполномоченного лица'), el('i',{},'Дед Мороз')),
        el('span',{class:'stamp '+(animate?'in':'static'),html:STAMP}));
      return [doc, el('p',{class:'secret center'},'🤫 Документ строго конфиденциальный. Никому не показывайте')];
    }
    function giftStage(r){
      const openedKey = 'santa:opened:'+id;
      const stage = el('div',{class:'stage'});
      if (ls.get(openedKey) || reduceMotion){ stage.append(...licenseDoc(r,false)); return stage; }
      const btn = el('button',{class:'btn btn-primary block',onclick:()=>{
        ls.set(openedKey,'1');
        stage.classList.remove('pending-doc'); stage.innerHTML='';
        stage.append(...licenseDoc(r,true));
        setTimeout(()=>burst(stage), 1000);
      }},'Получить разрешение');
      stage.classList.add('pending-doc');
      stage.append(el('div',{class:'status-card'},
        el('div',{class:'tick',html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'}),
        el('div',{class:'big'},'Заявка одобрена'),
        el('p',{class:'lead',style:{margin:'0'}},'Разрешение на вручение подарка готово. В нём имя коллеги, которому вы дарите.'),
        btn));
      return stage;
    }
    function burst(host){
      const colors=['#3a6ee0','#f4cf86','#7a55c9','#4f8a78','#8fb2f7','#fff'];
      for (let i=0;i<46;i++){
        const a=Math.random()*Math.PI*2, dist=90+Math.random()*130;
        const p=el('span',{class:'confetti',style:{background:colors[i%colors.length],animationDelay:(Math.random()*120)+'ms'}});
        p.style.setProperty('--dx',Math.cos(a)*dist+'px'); p.style.setProperty('--dy',(Math.sin(a)*dist-60)+'px');
        p.style.setProperty('--rot',(Math.random()*720-360)+'deg');
        if (i%3===0){ p.style.width='8px'; p.style.height='8px'; p.style.borderRadius='50%'; }
        host.append(p); setTimeout(()=>p.remove(),1600);
      }
    }

    function playerView(){
      const g = S.game;
      if (g.status === 'drawn' && S.recipient){
        return [
          el('section',{class:'sheet'}, giftStage(S.recipient)),
          el('section',{class:'sheet'},
            el('h2',{},'Ваше пожелание'),
            el('p',{class:'lead'},'Его видит ваш Тайный Санта. Можно поменять в любой момент.'),
            wishEditor(), accountLinks())
        ];
      }
      return [
        el('section',{class:'sheet'},
          el('h2',{},'Привет, '+S.me.name+'!'),
          el('div',{class:'waiting'},
            el('span',{html:'<svg viewBox="0 0 48 48"><rect x="8" y="20" width="32" height="22" rx="5" fill="#3a6ee0"/><rect x="5" y="14" width="38" height="9" rx="4" fill="#5b8bf0"/><rect x="21" y="14" width="6" height="28" fill="#f4cf86"/><path d="M24 14c-4-9-14-9-14-3s7 3 14 3zm0 0c4-9 14-9 14-3s-7 3-14 3z" fill="#f4cf86"/></svg>'}),
            el('p',{}, el('b',{},'Статус заявки: на рассмотрении у Деда Мороза.'),' После жеребьёвки здесь появится ваше разрешение на вручение подарка с именем коллеги.')),
          el('label',{for:'w-me'},'Ваше пожелание (его увидит ваш Санта)'),
          wishEditor()),
        el('section',{class:'plain'},
          el('h2',{},'Участники', el('span',{class:'count'}, String(g.players.length))),
          el('div',{class:'chips',style:{marginTop:'12px'}}, g.players.map((p,i)=>el('span',{class:'chip'+(p.id===S.me.id?' me':''),style:{animationDelay:(i*40)+'ms'}},p.name))),
          el('label',{style:{marginTop:'20px'}},'Позовите коллег'),
          shareButtons('🎅 Тайный Санта команды E-license «'+g.title+'». Подавай заявку:', shareUrl),
          accountLinks())
      ];
    }

    load();
    $('app').addEventListener('input', ()=>{ S.dirty = true; });
    const canRefresh = () => document.visibilityState==='visible' && !S.dirty && !modalOpen()
      && !(document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))
      && !document.querySelector('.pending-doc');
    const refresh = () => { if (canRefresh()) { render.quiet = true; load().finally(()=>{ render.quiet=false; }); } };
    setInterval(refresh, 20000);
    document.addEventListener('visibilitychange', refresh);
  }

  /* ================= панель организатора (отдельный адрес /g/<id>/admin) ================= */
  function adminPage(id){
    const hm = location.hash.match(/admin=([A-Za-z0-9_-]+)/);
    if (hm){ ls.set('santa:admin:'+id, hm[1]); history.replaceState(null,'',location.pathname); }
    const key = ls.get('santa:admin:'+id);
    const playerUrl = location.origin + '/g/' + id;
    const H = {'X-Admin-Key':key};
    let A = null;

    function noAccess(){
      hero({ title:'Только для организатора' });
      render(el('section',{class:'sheet center'},
        el('p',{class:'lead'},'Эта страница открывается только по ссылке организатора. Если вы участник, перейдите на страницу игры.'),
        el('a',{class:'btn btn-primary',href:playerUrl},'Открыть страницу игры')));
    }
    if (!key) return noAccess();

    async function load(){
      try{ A = await api('GET','/api/games/'+id+'/admin',null,H); }
      catch(e){
        if (e.status===403){ ls.del('santa:admin:'+id); return noAccess(); }
        hero({ title:'Не получилось загрузить' });
        return render(el('section',{class:'sheet center'}, el('p',{class:'lead'},e.message), el('button',{class:'btn btn-primary',onclick:load},'Повторить')));
      }
      rememberGame(id, A.title, true);
      draw();
    }
    const act = (path, method='POST') => async () => {
      try{ A = await api(method,'/api/games/'+id+'/admin'+path,null,H); render.quiet=true; draw(); render.quiet=false;
        if (path==='/draw') toast('Разрешения выданы 🎲'); }
      catch(e){ toast(e.message); }
    };

    function draw(){
      document.title = 'Кабинет организатора: ' + A.title;
      hero({ title:A.title, sub:'Кабинет организатора', facts:factsOf(A) });
      const total = A.players.length, wishes = A.players.filter(p=>p.hasWish).length, seen = A.players.filter(p=>p.seen).length;
      const drawn = A.status === 'drawn';
      const adminLink = playerUrl + '/admin#admin=' + key;

      render(
        el('section',{class:'sheet'},
          el('span',{class:'status'+(drawn?' done':'')}, el('i'), drawn ? 'Разрешения выданы' : 'Идёт приём заявок'),
          el('h2',{style:{marginTop:'14px'}},'Ссылка для участников'),
          el('p',{class:'lead'},'Отправьте её в рабочий чат. По ней можно только подать заявку и получить своё разрешение, управлять игрой нельзя.'),
          el('div',{class:'linkbox'}, playerUrl),
          shareButtons('🎅 Тайный Санта команды E-license «'+A.title+'». Подавай заявку и пиши пожелание:', playerUrl)),

        el('section',{class:'sheet'},
          el('h2',{},'Участники', el('span',{class:'count'}, String(total))),
          el('p',{class:'lead',style:{marginBottom:'4px'}}, drawn
            ? 'Получили разрешение: '+seen+' из '+total+'. С пожеланием: '+wishes+'.'
            : 'С пожеланием: '+wishes+' из '+total+'. Кто кому дарит, не видно даже вам.'),
          drawn ? el('div',{class:'progress'}, el('b',{style:{width:(total?Math.round(seen/total*100):0)+'%'}})) : null,
          el('div',{class:'people'}, total ? A.players.map(p=>el('div',{class:'person'},
            avatar(p.name),
            el('span',{class:'n'},p.name),
            drawn ? el('span',{class:'pill'+(p.seen?' ok':'')}, p.seen?'получил(а)':'ещё не открыл(а)')
                  : el('span',{class:'pill'+(p.hasWish?' ok':'')}, p.hasWish?'есть пожелание':'без пожелания'),
            !drawn ? el('button',{class:'x',title:'Удалить','aria-label':'Удалить '+p.name,onclick:()=>confirmBox('Удалить '+p.name+'?','Участник пропадёт из игры. Он сможет записаться заново.','Удалить',act('/players/'+p.id,'DELETE'))},'✕') : null
          )) : el('p',{class:'lead',style:{margin:'10px 0 0'}},'Заявок пока нет. Отправьте ссылку в рабочий чат, и участники появятся здесь.')),
          !drawn
            ? el('button',{class:'btn btn-primary block',disabled: total<3 ? true : null,onclick:()=>confirmBox('Распределить пары и выдать разрешения?','Участников: '+total+'. После этого приём заявок закроется. Пары увидят только сами участники.','Выдать разрешения',act('/draw'))}, total<3 ? 'Нужно минимум 3 заявки' : 'Распределить пары и выдать разрешения')
            : el('button',{class:'btn btn-danger block',onclick:()=>confirmBox('Отозвать разрешения?','Пары сбросятся, приём заявок снова откроется. Потом нужно будет распределить заново.','Отозвать',act('/reset'))},'Отозвать разрешения и перераспределить')),

        el('section',{class:'plain'},
          el('h2',{},'Ваш доступ'),
          el('p',{class:'lead'},'Ссылка организатора открывает эту панель на любом телефоне. Не отправляйте её в общий чат.'),
          el('div',{class:'share',style:{gridTemplateColumns:'1fr 1fr'}},
            el('button',{class:'btn btn-sm btn-soft',onclick:()=>copy(adminLink,'Ссылка организатора скопирована')},'Скопировать ссылку организатора'),
            el('a',{class:'btn btn-sm btn-soft',href:playerUrl},'Участвовать самому')))
      );
    }

    load();
    const refresh = () => { if (document.visibilityState==='visible' && !modalOpen()) { render.quiet=true; load().finally(()=>{ render.quiet=false; }); } };
    setInterval(refresh, 20000);
    document.addEventListener('visibilitychange', refresh);
  }
})();
</script>
</body>
</html>
