<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a24">
<title>Тайный Санта</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎅</text></svg>">
<style>
  :root{--bg:#0f2a24;--ink:#1d2321;--muted:#6b7570;--red:#c8372d;--red-d:#a32b22;--green:#1f6f54;--green-l:#eaf5f0;--line:#e4e8e6;--soft:#f4f6f5;--gold:#fdf1d8}
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 20% 0,#1a4a3e 0,var(--bg) 700px) no-repeat var(--bg);color:var(--ink);min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 14px 60px}
  header{color:#fff;text-align:center;margin:6px 0 16px}
  header h1{margin:0;font-size:26px;word-break:break-word}
  header p{margin:6px 0 0;color:#bcd3cb;font-size:14px}
  header a{color:#bcd3cb;text-decoration:none}
  .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
  .card h2{margin:0 0 6px;font-size:18px}
  .hint{color:var(--muted);font-size:13px;margin:0 0 12px;line-height:1.45}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--soft);color:var(--ink);font-family:inherit}
  textarea{resize:vertical;min-height:80px}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--green);border-color:transparent;background:#fff}
  .row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
  .btn{border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:var(--red-d)}
  .btn-green{background:var(--green);color:#fff}
  .btn-ghost{background:var(--soft);color:var(--ink)}
  .btn-danger{background:#fff;color:var(--red);border:1px solid #f0c9c5}
  .btn-link{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;padding:6px;font-family:inherit}
  .btn-sm{padding:8px 10px;font-size:13px;border-radius:9px}
  .tg{background:#2aabee;color:#fff}.wa{background:#25d366;color:#fff}
  .full{width:100%;margin-top:12px}
  .err{color:var(--red);font-size:13px;margin-top:8px;min-height:1em}
  .share{display:flex;gap:6px;margin-top:10px}.share>*{flex:1}
  .linkbox{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;word-break:break-all;margin-top:6px;user-select:all}
  .plist{margin-top:6px}
  .prow{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
  .prow:first-child{border-top:0}
  .prow .n{flex:1;font-weight:600;word-break:break-word}
  .tag{font-size:12px;border-radius:7px;padding:3px 7px;background:var(--soft);color:var(--muted);white-space:nowrap}
  .tag.ok{background:var(--green-l);color:var(--green)}
  .x{border:0;background:#eef1f0;border-radius:50%;width:28px;height:28px;cursor:pointer;color:var(--muted)}
  .names{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{background:var(--soft);border-radius:999px;padding:6px 12px;font-size:14px}
  .chip.me{background:var(--green-l);color:var(--green);font-weight:600}
  .gift-card{text-align:center;padding:4px 0}
  .gift-card .small{font-size:14px;color:var(--muted)}
  .gift-card .gift{font-size:32px;font-weight:800;color:var(--red);margin:6px 0 12px;word-break:break-word}
  .wish{background:var(--gold);border-radius:12px;padding:12px;text-align:left;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .wish.empty{background:var(--soft);color:var(--muted)}
  .wish-label{font-size:12px;font-weight:700;color:#8a5a00;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
  .meta{font-size:14px;color:var(--muted);margin-top:10px}
  .badge{display:inline-block;background:var(--gold);color:#8a5a00;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600}
  .pin{letter-spacing:12px;text-align:center;font-size:24px;font-weight:700}
  .center{text-align:center}
  .loader{color:#cfe3db;text-align:center;padding:40px 10px;line-height:1.6}
  .spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;margin:0 auto 12px;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .hidden{display:none!important}
  .overlay{position:fixed;inset:0;background:rgba(8,20,17,.85);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
  .modal{background:#fff;border-radius:18px;padding:20px;max-width:400px;width:100%;text-align:center}
  .modal h3{margin:0 0 8px}.modal p{color:var(--muted);line-height:1.45;margin:0 0 14px}
  .modal .btns{display:flex;gap:8px}.modal .btns>*{flex:1}
  .toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d2321;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
  .toast.show{opacity:1}
  details summary{cursor:pointer;font-weight:700;font-size:17px;list-style:none}
  details summary::-webkit-details-marker{display:none}
  details summary::after{content:' ▾';color:var(--muted)}
  details[open] summary::after{content:' ▴'}
  .footer{color:#9db8ae;text-align:center;font-size:12px;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="h-title"><a href="/">🎅 Тайный Санта</a></h1>
    <p id="h-sub">Каждый знает, кому дарит, но не знает, кто дарит ему</p>
  </header>
  <main id="app"><div class="loader"><div class="spin"></div>Загрузка…</div></main>
  <div class="footer">Пары знает только сервер — даже организатор их не видит.</div>
</div>
<div class="overlay hidden" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  /* ================= утилиты ================= */
  const $ = (id) => document.getElementById(id);
  function el(tag, attrs, ...kids){
    const e = document.createElement(tag);
    for (const k in (attrs||{})){
      const v = attrs[k];
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (k === 'value') e.value = v;
      else e.setAttribute(k, v === true ? '' : v);
    }
    kids.flat().forEach(c => { if (c === null || c === undefined || c === '') return; e.append(c instanceof Node ? c : document.createTextNode(c)); });
    return e;
  }
  const ls = {
    get(k){ try { return localStorage.getItem(k); } catch { return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch {} },
    del(k){ try { localStorage.removeItem(k); } catch {} },
  };
  let toastT;
  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }
  function closeModal(){ $('overlay').classList.add('hidden'); $('modal').innerHTML=''; }
  function confirmBox(title, text, okText, onOk){
    const m=$('modal'); m.innerHTML='';
    m.append(el('h3',{},title), el('p',{},text), el('div',{class:'btns'},
      el('button',{class:'btn btn-ghost',onclick:closeModal},'Отмена'),
      el('button',{class:'btn btn-primary',onclick:()=>{ closeModal(); onOk(); }},okText)));
    $('overlay').classList.remove('hidden');
  }
  $('overlay').addEventListener('click', e => { if (e.target.id==='overlay') closeModal(); });

  let slowT;
  async function api(method, url, body, headers){
    clearTimeout(slowT);
    slowT = setTimeout(()=>toast('Сервер просыпается, это может занять до минуты…'), 4000);
    try{
      const r = await fetch(url, { method, headers: { 'Content-Type':'application/json', ...(headers||{}) }, body: body ? JSON.stringify(body) : undefined });
      let data = {}; try { data = await r.json(); } catch {}
      if (!r.ok) { const e = new Error(data.error || 'Ошибка '+r.status); e.status = r.status; throw e; }
      return data;
    } finally { clearTimeout(slowT); }
  }
  async function copy(text, okMsg){
    try { await navigator.clipboard.writeText(text); toast(okMsg || 'Скопировано'); }
    catch { window.prompt('Скопируйте:', text); }
  }
  function busy(btn, on){ if (!btn) return; btn.disabled = on; if (on) { btn.dataset.t = btn.textContent; btn.textContent = '…'; } else if (btn.dataset.t) btn.textContent = btn.dataset.t; }
  const metaLine = (g) => [g.budget && '💰 '+g.budget, g.date && '📅 '+g.date].filter(Boolean).join('   ');
  function shareButtons(text, url){
    return el('div',{class:'share'},
      el('a',{class:'btn btn-sm tg',href:'https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(text),target:'_blank',rel:'noopener'},'Telegram'),
      el('a',{class:'btn btn-sm wa',href:'https://wa.me/?text='+encodeURIComponent(text+'\n'+url),target:'_blank',rel:'noopener'},'WhatsApp'),
      el('button',{class:'btn btn-sm btn-ghost',onclick:()=>copy(text+'\n'+url,'Ссылка скопирована')},'Копировать'));
  }
  function render(...nodes){ const a=$('app'); a.innerHTML=''; nodes.flat().forEach(n=>n && a.append(n)); }

  /* ================= маршрутизация ================= */
  const m = location.pathname.match(/^\/g\/([a-z0-9]+)\/?$/);
  if (m) gamePage(m[1]); else homePage();

  /* ================= главная: создать игру ================= */
  function homePage(){
    const mine = JSON.parse(ls.get('santa:games') || '[]');
    const t = el('input',{placeholder:'Новый год с друзьями',maxlength:'60'});
    const b = el('input',{placeholder:'до 10 000 ₸',maxlength:'30'});
    const d = el('input',{placeholder:'27 декабря',maxlength:'30'});
    const err = el('div',{class:'err'});
    const btn = el('button',{class:'btn btn-primary full',onclick:async()=>{
      err.textContent=''; busy(btn,true);
      try{
        const r = await api('POST','/api/games',{ title:t.value, budget:b.value, date:d.value });
        ls.set('santa:admin:'+r.id, r.adminKey);
        rememberGame(r.id, t.value || 'Тайный Санта', true);
        location.href = '/g/'+r.id;
      }catch(e){ err.textContent=e.message; busy(btn,false); }
    }},'🎄 Создать игру');

    render(
      el('div',{class:'card'},
        el('h2',{},'Новая игра'),
        el('p',{class:'hint'},'Создайте игру и отправьте ссылку в общий чат. Каждый откроет её на своём телефоне, впишет имя и пожелание. Потом вы нажмёте «Распределить», и каждый увидит, кому дарит.'),
        el('label',{},'Название'), t,
        el('div',{class:'row'}, el('div',{},el('label',{},'Бюджет'),b), el('div',{},el('label',{},'Дата обмена'),d)),
        btn, err),
      mine.length ? el('div',{class:'card'}, el('h2',{},'Мои игры'),
        el('div',{class:'plist'}, mine.map(g => el('div',{class:'prow'},
          el('a',{class:'n',href:'/g/'+g.id,style:'color:inherit;text-decoration:none'}, g.title),
          g.admin ? el('span',{class:'tag ok'},'организатор') : el('span',{class:'tag'},'участник'))))) : null
    );
  }
  function rememberGame(id, title, admin){
    const list = JSON.parse(ls.get('santa:games') || '[]').filter(g => g.id !== id);
    const prev = JSON.parse(ls.get('santa:games') || '[]').find(g => g.id === id);
    list.unshift({ id, title, admin: admin || (prev && prev.admin) || false });
    ls.set('santa:games', JSON.stringify(list.slice(0,20)));
  }

  /* ================= страница игры ================= */
  function gamePage(id){
    // ссылка организатора: /g/<id>#admin=<key>
    const hm = location.hash.match(/admin=([A-Za-z0-9_-]+)/);
    if (hm){ ls.set('santa:admin:'+id, hm[1]); history.replaceState(null,'',location.pathname); }

    const S = {
      id, game:null, me:null, recipient:null, admin:null,
      adminKey: ls.get('santa:admin:'+id),
      token: ls.get('santa:token:'+id),
      mode: 'join', // join | login
      dirty: false, // пользователь что-то вводит — не перерисовывать
    };
    const shareUrl = location.origin + '/g/' + id;

    async function load(){
      try{
        S.game = await api('GET','/api/games/'+id);
      }catch(e){
        if (e.status===404) return render(el('div',{class:'card center'}, el('h2',{},'Игра не найдена'), el('p',{class:'hint'},'Проверьте ссылку или создайте новую игру.'), el('a',{class:'btn btn-primary',href:'/'},'На главную')));
        return render(el('div',{class:'card center'}, el('h2',{},'Не удалось загрузить'), el('p',{class:'hint'},e.message), el('button',{class:'btn btn-primary',onclick:load},'Повторить')));
      }
      if (S.token){
        try{
          const r = await api('GET','/api/games/'+id+'/me',null,{'X-Player-Token':S.token});
          S.me = r.me; S.recipient = r.recipient; S.game = r.game;
        }catch(e){ if (e.status===401){ ls.del('santa:token:'+id); S.token=null; S.me=null; } }
      }
      if (S.adminKey){
        try{ S.admin = await api('GET','/api/games/'+id+'/admin',null,{'X-Admin-Key':S.adminKey}); }
        catch(e){ if (e.status===403){ ls.del('santa:admin:'+id); S.adminKey=null; S.admin=null; } }
      }
      rememberGame(id, S.game.title, !!S.adminKey);
      draw();
    }

    function draw(){
      const g = S.game;
      $('h-title').textContent = '🎅 ' + g.title;
      $('h-sub').textContent = metaLine(g) || 'Каждый знает, кому дарит, но не знает, кто дарит ему';
      document.title = g.title + ' · Тайный Санта';
      S.dirty = false;
      render(S.me ? playerCard() : authCard(), S.admin ? adminCard() : null);
    }

    /* ---------- вход / регистрация ---------- */
    function authCard(){
      const g = S.game;
      const err = el('div',{class:'err'});
      if (g.status === 'open' && S.mode === 'join'){
        const name = el('input',{placeholder:'Как вас зовут?',maxlength:'40',autocomplete:'given-name'});
        const pin = el('input',{class:'pin',type:'password',inputmode:'numeric',maxlength:'4',placeholder:'••••',autocomplete:'off'});
        const wish = el('textarea',{placeholder:'Например: книга, настолка, что-то к чаю… (можно дописать позже)',maxlength:'300'});
        const btn = el('button',{class:'btn btn-primary full',onclick:async()=>{
          err.textContent=''; busy(btn,true);
          try{
            const r = await api('POST','/api/games/'+id+'/join',{ name:name.value, pin:pin.value, wish:wish.value });
            S.token = r.token; ls.set('santa:token:'+id, r.token);
            toast('Вы в игре! 🎉'); await load();
          }catch(e){ err.textContent=e.message; busy(btn,false); }
        }},'Участвую!');
        return el('div',{class:'card'},
          el('h2',{},'Присоединиться к игре'),
          el('p',{class:'hint'},'PIN нужен, чтобы зайти с другого устройства и чтобы никто не открыл вашу карточку.'),
          el('label',{},'Имя'), name,
          el('label',{},'Придумайте PIN из 4 цифр'), pin,
          el('label',{},'🎁 Что бы вы хотели получить?'), wish,
          btn, err,
          g.players.length ? el('div',{}, el('label',{},'Уже участвуют ('+g.players.length+')'), el('div',{class:'names'}, g.players.map(p=>el('span',{class:'chip'},p.name)))) : null,
          g.players.length ? el('div',{class:'center',style:'margin-top:10px'}, el('button',{class:'btn-link',onclick:()=>{S.mode='login';draw();}},'Я уже участвую — войти')) : null
        );
      }
      // вход существующего участника
      if (!g.players.length) return el('div',{class:'card center'}, el('p',{class:'hint'},'В игре пока нет участников.'));
      const sel = el('select',{}, el('option',{value:''},'— выберите своё имя —'), g.players.map(p=>el('option',{value:p.id},p.name)));
      const pin = el('input',{class:'pin',type:'password',inputmode:'numeric',maxlength:'4',placeholder:'••••',autocomplete:'off'});
      const btn = el('button',{class:'btn btn-primary full',onclick:async()=>{
        err.textContent='';
        if (!sel.value){ err.textContent='Выберите имя'; return; }
        busy(btn,true);
        try{
          const r = await api('POST','/api/games/'+id+'/login',{ playerId:sel.value, pin:pin.value });
          S.token = r.token; ls.set('santa:token:'+id, r.token); await load();
        }catch(e){ err.textContent=e.message; pin.value=''; busy(btn,false); }
      }},'Войти');
      return el('div',{class:'card'},
        el('h2',{}, g.status==='drawn' ? '🎲 Жеребьёвка уже прошла' : 'Войти'),
        el('p',{class:'hint'}, g.status==='drawn' ? 'Выберите своё имя и введите PIN, чтобы узнать, кому дарите.' : 'Выберите своё имя и введите PIN, который придумали при регистрации.'),
        el('label',{},'Кто вы?'), sel,
        el('label',{},'PIN'), pin,
        btn, err,
        g.status==='open' ? el('div',{class:'center',style:'margin-top:10px'}, el('button',{class:'btn-link',onclick:()=>{S.mode='join';draw();}},'Я новый участник')) : null,
        el('p',{class:'hint',style:'margin-top:10px'},'Забыли PIN? Попросите организатора удалить вас до жеребьёвки и зарегистрируйтесь заново.')
      );
    }

    /* ---------- карточка участника ---------- */
    function wishEditor(){
      const ta = el('textarea',{maxlength:'300',placeholder:'Например: книга, настолка, что-то к чаю…',value:S.me.wish});
      const btn = el('button',{class:'btn btn-green full',onclick:async()=>{
        busy(btn,true);
        try{
          const r = await api('PUT','/api/games/'+id+'/me/wish',{ wish:ta.value },{'X-Player-Token':S.token});
          S.me.wish = r.wish; toast('Пожелание сохранено'); draw();
        }catch(e){ toast(e.message); busy(btn,false); }
      }},'Сохранить пожелание');
      return [ta, btn];
    }
    function playerCard(){
      const g = S.game;
      const logout = el('div',{class:'center',style:'margin-top:6px'},
        el('button',{class:'btn-link',onclick:()=>confirmBox('Выйти на этом устройстве?','Вернуться можно по своему имени и PIN.','Выйти',()=>{ ls.del('santa:token:'+id); S.token=null; S.me=null; S.mode='login'; draw(); })},'Выйти на этом устройстве'),
        g.status==='open' ? el('button',{class:'btn-link',onclick:()=>confirmBox('Покинуть игру?','Вы исчезнете из списка участников.','Покинуть',async()=>{
          try{ await api('DELETE','/api/games/'+id+'/me',null,{'X-Player-Token':S.token}); ls.del('santa:token:'+id); S.token=null; S.me=null; S.mode='join'; await load(); }
          catch(e){ toast(e.message); }
        })},'Покинуть игру') : null);

      if (g.status === 'drawn' && S.recipient){
        const r = S.recipient;
        return [
          el('div',{class:'card'},
            el('div',{class:'gift-card'},
              el('div',{class:'small'}, S.me.name+', ты даришь подарок:'),
              el('div',{class:'gift'}, r.name),
              r.wish ? el('div',{class:'wish'}, el('div',{class:'wish-label'},'🎁 '+r.name+' хочет'), r.wish)
                     : el('div',{class:'wish empty'}, r.name+' пока не написал(а) пожелание. Загляните позже: оно появится здесь.'),
              metaLine(g) ? el('div',{class:'meta'}, metaLine(g)) : null),
            el('p',{class:'hint center',style:'margin:12px 0 0'},'🤫 Никому не говори!')),
          el('div',{class:'card'},
            el('h2',{},'✍️ Твоё пожелание'),
            el('p',{class:'hint'},'Его увидит твой Тайный Санта. Можно менять когда угодно.'),
            wishEditor(), logout)
        ];
      }
      return el('div',{class:'card'},
        el('h2',{},'Привет, '+S.me.name+'! 👋'),
        el('p',{class:'hint'},'Вы в игре. Когда организатор проведёт жеребьёвку, на этой странице появится имя того, кому вы дарите, и его пожелание.'),
        el('label',{},'🎁 Ваше пожелание (его увидит ваш Санта)'),
        wishEditor(),
        el('label',{},'Участники ('+g.players.length+')'),
        el('div',{class:'names'}, g.players.map(p=>el('span',{class:'chip'+(p.id===S.me.id?' me':'')},p.name))),
        el('div',{style:'margin-top:12px'}, el('label',{},'Позвать друзей'), shareButtons('🎅 Присоединяйся к Тайному Санте «'+g.title+'»!', shareUrl)),
        logout);
    }

    /* ---------- панель организатора ---------- */
    function adminCard(){
      const a = S.admin;
      const hdr = {'X-Admin-Key':S.adminKey};
      const total = a.players.length, wishes = a.players.filter(p=>p.hasWish).length, seen = a.players.filter(p=>p.seen).length;
      const err = el('div',{class:'err'});
      const act = (path, method='POST') => async () => {
        try{ S.admin = await api(method,'/api/games/'+id+'/admin'+path,null,hdr); await load(); }
        catch(e){ err.textContent=e.message; }
      };
      const adminLink = shareUrl + '#admin=' + S.adminKey;
      return el('details',{class:'card',open: !S.me || a.status==='open' ? true : null},
        el('summary',{},'👑 Панель организатора'),
        el('div',{style:'margin-top:12px'},
          el('span',{class:'badge'}, a.status==='open' ? '📝 Идёт сбор участников' : '✅ Жеребьёвка проведена'),
          el('label',{},'Ссылка для участников, отправьте в общий чат'),
          el('div',{class:'linkbox'}, shareUrl),
          shareButtons('🎅 Тайный Санта «'+a.title+'»! Заходи, впиши имя и пожелание:', shareUrl),
          el('label',{style:'margin-top:16px'},'Участники: '+total+' · с пожеланием: '+wishes + (a.status==='drawn' ? ' · посмотрели пару: '+seen : '')),
          el('div',{class:'plist'}, a.players.length ? a.players.map(p=>el('div',{class:'prow'},
            el('span',{class:'n'},p.name),
            el('span',{class:'tag'+(p.hasWish?' ok':'')}, p.hasWish?'🎁 пожелание':'без пожелания'),
            a.status==='drawn' ? el('span',{class:'tag'+(p.seen?' ok':'')}, p.seen?'👀':'—') : null,
            a.status==='open' ? el('button',{class:'x',title:'Удалить','aria-label':'Удалить '+p.name,onclick:()=>confirmBox('Удалить '+p.name+'?','Участник исчезнет из игры.','Удалить',act('/players/'+p.id,'DELETE'))},'✕') : null
          )) : el('p',{class:'hint'},'Пока никого. Отправьте ссылку в чат.')),
          a.status==='open'
            ? el('button',{class:'btn btn-primary full',disabled: total<3 ? true : null,onclick:()=>confirmBox('Распределить?','Участников: '+total+'. После жеребьёвки новые участники не смогут присоединиться. Пары не увидит никто, кроме самих участников.','Распределить',act('/draw'))}, total<3 ? 'Нужно минимум 3 участника' : '🎲 Распределить')
            : el('button',{class:'btn btn-danger full',onclick:()=>confirmBox('Отменить жеребьёвку?','Пары сбросятся, игра снова откроется для записи. Потом нужно будет распределить заново.','Отменить',act('/reset'))},'🔄 Отменить жеребьёвку'),
          err,
          el('label',{style:'margin-top:16px'},'🔑 Ссылка организатора, сохраните её себе'),
          el('p',{class:'hint'},'По ней можно управлять игрой с другого устройства. Никому её не отправляйте.'),
          el('button',{class:'btn btn-ghost btn-sm',onclick:()=>copy(adminLink,'Ссылка организатора скопирована')},'Скопировать ссылку организатора')
        ));
    }

    load();
    // автообновление: новые участники, пожелание получателя, статус жеребьёвки
    $('app').addEventListener('input', ()=>{ S.dirty = true; });
    const canRefresh = () => document.visibilityState==='visible' && !S.dirty
      && $('overlay').classList.contains('hidden')
      && !(document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));
    setInterval(()=>{ if (canRefresh()) load(); }, 20000);
    document.addEventListener('visibilitychange',()=>{ if (canRefresh()) load(); });
  }
})();
</script>
</body>
</html>
